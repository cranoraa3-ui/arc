<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KNHS Portal — Reset Password</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <!-- BACKGROUND STARS -->
  <div class="stars" id="stars"></div>

  <div class="page-wrap">

    <!-- LEFT BRAND PANEL -->
    <div class="brand-panel">
      <div class="brand-glow"></div>

      <div class="brand-content">
        <div class="school-crest">
          <div class="crest-ring outer"></div>
          <div class="crest-ring middle"></div>
          <div class="crest-icon">🔐</div>
        </div>

        <h1 class="school-name">Reset Password</h1>
        <p class="school-sub">KNHS Portal Security</p>

        <div class="brand-divider"></div>

        <p class="brand-tagline">
          Enter a new password to secure your account
        </p>
      </div>
    </div>

    <!-- RIGHT FORM PANEL -->
    <div class="form-panel">
      <div class="form-card">

        <!-- HEADER -->
        <div class="form-header">
          <h2>Create New Password</h2>
          <p>Make sure it's strong and secure</p>
        </div>

        <!-- MESSAGE BOX (ONLY ONE) -->
        <div class="msg-box" id="msgBox"></div>

        <!-- INPUT -->
        <div class="field-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="newPassword"
              placeholder="Enter new password"
            />
          </div>
        </div>

        <!-- BUTTON -->
        <button class="submit-btn" id="btn">
          <span class="btn-text">Reset Password</span>
          <span class="btn-spinner hidden" id="spinner">⟳</span>
        </button>

        <!-- FOOTER -->
        <div class="form-footer">
          <a href="login.html">Back to Login</a>
        </div>

      </div>
    </div>

  </div>

  <!-- JS -->
  <script src="js/reset-password.js"></script>

</body>
</html>
