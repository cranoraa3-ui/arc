<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KNHS Portal — Forgot Password</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- REUSE LOGIN CSS -->
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <!-- STARS -->
  <div class="stars" id="stars"></div>

  <div class="page-wrap">

    <!-- LEFT PANEL -->
    <div class="brand-panel">
      <div class="brand-glow"></div>

      <div class="brand-content">
        <div class="school-crest">
          <div class="crest-ring outer"></div>
          <div class="crest-ring middle"></div>
          <div class="crest-icon">📧</div>
        </div>

        <h1 class="school-name">Forgot Password</h1>
        <p class="school-sub">KNHS Portal Recovery</p>

        <div class="brand-divider"></div>

        <p class="brand-tagline">
          We’ll send you a reset link to your email
        </p>
      </div>
    </div>

    <!-- RIGHT FORM -->
    <div class="form-panel">
      <div class="form-card">

        <div class="form-header">
          <h2>Reset your password</h2>
          <p>Enter your email to continue</p>
        </div>

        <div class="msg-box" id="msgBox"></div>

        <!-- EMAIL FIELD -->
        <div class="field-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">📧</span>
            <input type="email" id="email" placeholder="Enter your email" />
          </div>
        </div>

        <!-- BUTTON -->
        <button class="submit-btn" id="btn">
          <span class="btn-text">Send Reset Link</span>
          <span class="btn-spinner hidden" id="spinner">⟳</span>
        </button>

        <div class="form-footer">
          <a href="login.html">Back to Login</a>
        </div>

      </div>
    </div>

  </div>

  <!-- JS (NO INLINE = CSP SAFE) -->
  <script src="js/forgot-password.js"></script>

  <!-- STARS SCRIPT -->
  <script>
    const container = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = `
        left:${Math.random()*100}%;
        top:${Math.random()*100}%;
        width:${Math.random()*2+1}px;
        height:${Math.random()*2+1}px;
        animation-delay:${Math.random()*4}s;
        animation-duration:${Math.random()*3+2}s;
      `;
      container.appendChild(s);
    }
  </script>
  <script src="js/forgot-password.js"></script>

</body>
</html>
